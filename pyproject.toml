[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["src/pyfinbot/alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["src/pyfinbot/alembic", "tests"]
plugins = ["sqlalchemy.ext.mypy.plugin"]

[tool.coverage.run]
concurrency = ["greenlet", "thread"]
