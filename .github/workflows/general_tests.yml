name: General Tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']

    steps:
    - name: Check out repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 2

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Check the gth pins agree
      run: python scripts/check_gth_pins.py

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.3

    - name: Install dependencies
      run: uv pip install --system -r requirements.txt

    - name: Run tests
      run: pytest

  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 2

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Check the gth pins agree
      run: python scripts/check_gth_pins.py

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.3

    - name: Install dependencies
      run: uv pip install --system -r requirements.txt

    - name: Ruff
      run: ruff check src tests

    - name: Mypy
      run: mypy src/pyfinbot
