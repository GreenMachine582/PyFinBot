version: '3.9'

services:

  pyfinbot:
    build: .
    container_name: pyfinbot
    command: uvicorn src.pyfinbot.pyfinbot:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - .:/app
    ports:
      - "8001:8001"
    env_file:
      - .env
    # /health/ready runs SELECT 1 against the database (greentechhub's
    # register_health). urllib, since the image has no curl.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3